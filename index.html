  /* ---------- film engine glue ---------- */
  const FILM_IDS = ['warm', 'gold', 'night', 'flash'];
  const pad2 = n => String(n).padStart(2, '0');
  const stampText = d => `'${String(d.getFullYear()).slice(2)} ${pad2(d.getMonth() + 1)} ${pad2(d.getDate())}`;
  function drawStamp(x, W, H, when) {
    const fs = Math.max(12, Math.round(Math.min(W, H) * 0.045));
    x.save();
    x.font = `500 ${fs}px "IBM Plex Mono", ui-monospace, monospace`;
    x.textAlign = 'right'; x.textBaseline = 'bottom';
    x.shadowColor = 'rgba(255,110,30,0.9)'; x.shadowBlur = fs * 0.5;
    x.fillStyle = '#FF9A40';
    x.fillText(stampText(when), W - fs * 0.9, H - fs * 0.7);
    x.restore();
  }
  function coverDraw(x, src, sw, sh, W, H, mirror) {
    const r = W / H;
    let cw = sw, ch = sw / r;
    if (ch > sh) { ch = sh; cw = sh * r; }
    if (mirror) { x.translate(W, 0); x.scale(-1, 1); }
    x.drawImage(src, (sw - cw) / 2, (sh - ch) / 2, cw, ch, 0, 0, W, H);
    if (mirror) x.setTransform(1, 0, 0, 1, 0, 0);
  }
  function plainFilm(x, src, sw, sh, W, H, o, when) {
    coverDraw(x, src, sw, sh, W, H, o.mirror);
    x.save();
    x.globalCompositeOperation = 'soft-light'; x.fillStyle = 'rgba(255,150,70,0.45)'; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'screen'; x.fillStyle = 'rgb(30,18,10)'; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'source-over';
    const vg = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(20,8,0,0)'); vg.addColorStop(1, 'rgba(20,8,0,0.5)');
    x.fillStyle = vg; x.fillRect(0, 0, W, H);
    x.restore();
    drawStamp(x, W, H, when);
  }
  let captureGL;
  function gradeTo2D(srcEl, sw, sh, W, H, filmId, o, when) {
    if (captureGL === undefined) captureGL = makeFilmGL(document.createElement('canvas'), true);
    const out = document.createElement('canvas');
    out.width = W; out.height = H;
    const x = out.getContext('2d');
    if (captureGL) {
      captureGL.render(srcEl, sw, sh, W, H, FILMS[filmId] || FILMS.warm, o);
      x.drawImage(captureGL.canvas, 0, 0);
      drawStamp(x, W, H, when);
    } else plainFilm(x, srcEl, sw, sh, W, H, o, when);
    return out;
  }
  function loadImage(file) {
    return new Promise((res, rej) => {
      const u = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(u); res(img); };
      img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('bad_image')); };
      img.src = u;
    });
  }

  /* ---------- live viewfinder ---------- */
  const Live = { stream: null, raf: 0, facing: 'environment', on: false, failed: false, frame: 0, side: Math.random() < 0.5 ? 0 : 1 };
  const finderVideo = $('#finder-video'), finderCanvas = $('#finder-canvas');
  const leakNow = () => ({ x: Live.side, y: 0.5 + 0.32 * Math.sin(performance.now() / 2600) });
  let finderGL, lastStamp = '';
  function liveLoop() {
    if (!Live.on) return;
    const v = finderVideo;
    if (v.videoWidth) {
      const W = Math.min(1080, Math.round((finderCanvas.clientWidth || 360) * Math.min(window.devicePixelRatio || 1, 2)));
      const H = Math.round(W * 4 / 3);
      Live.frame += 1;
      if (finderGL === undefined) finderGL = makeFilmGL(finderCanvas, false);
      const lk = leakNow();
      if (finderGL) {
        finderGL.render(v, v.videoWidth, v.videoHeight, W, H, FILMS[S.cam.film] || FILMS.warm, { mirror: Live.facing === 'user', seed: (Math.floor(Live.frame / 2) * 1.618) % 100, leakY: lk.y, leakSide: Live.side });
      } else {
        if (finderCanvas.width !== W) { finderCanvas.width = W; finderCanvas.height = H; }
        plainFilm(finderCanvas.getContext('2d'), v, v.videoWidth, v.videoHeight, W, H, { mirror: Live.facing === 'user' }, new Date());
      }
      const st = stampText(new Date());
      if (st !== lastStamp) { lastStamp = st; $('#finder-stamp').textContent = finderGL ? st : ''; }
    }
    Live.raf = requestAnimationFrame(liveLoop);
  }
  async function startLive() {
    if (Live.on || Live.failed || S.screen !== 'camera' || !S.me || shotsLeft() <= 0) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { Live.failed = true; renderCamera(); return; }
    try {
      Live.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: Live.facing, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
      if (S.screen !== 'camera') { stopLive(); return; }
      finderVideo.srcObject = Live.stream;
      await finderVideo.play();
      Live.on = true;
      renderCamera();
      liveLoop();
    } catch (err) { Live.failed = true; stopLive(); renderCamera(); }
  }
  function stopLive() {
    cancelAnimationFrame(Live.raf);
    Live.raf = 0;
    if (Live.stream) Live.stream.getTracks().forEach(tr => tr.stop());
    Live.stream = null;
    Live.on = false;
    try { finderVideo.srcObject = null; } catch (err) { /* ignore */ }
  }
  $('#finder-flip').addEventListener('click', () => { Live.facing = Live.facing === 'user' ? 'environment' : 'user'; stopLive(); startLive(); });

  /* ---------- upload queue (survives a dropped connection; IndexedDB when available) ---------- */
  const QDB = (() => {
    let dbp = null;
    function open() {
      if (dbp) return dbp;
      dbp = new Promise(res => {
        try {
          const rq = indexedDB.open('prom-night', 1);
          rq.onupgradeneeded = () => rq.result.createObjectStore('queue', { keyPath: 'key', autoIncrement: true });
          rq.onsuccess = () => res(rq.result);
          rq.onerror = () => res(null);
        } catch (e) { res(null); }
      });
      return dbp;
    }
    const tx = async (mode, fn) => { const db = await open(); if (!db) return null; return new Promise(res => { try { const s = db.transaction('queue', mode).objectStore('queue'); const r = fn(s); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } }); };
    return { all: () => tx('readonly', s => s.getAll()), add: item => tx('readwrite', s => s.add(item)), del: key => tx('readwrite', s => s.delete(key)) };
  })();
  async function loadQueue() {
    const all = (await QDB.all()) || [];
    S.queue = all.filter(q => q.code === S.code);
  }
  const shotsLeft = () => S.me ? Math.max(0, (S.me.shotsMax || 15) - (S.me.shots || 0) - S.queue.length) : 0;
  let pumping = false, pumpTimer = 0;
  async function pumpQueue() {
    if (pumping || !S.code) return;
    pumping = true;
    clearTimeout(pumpTimer);
    try {
      while (S.queue.length) {
        const item = S.queue[0];
        try {
          const r = await api('shot', { code: item.code, data: item.data, at: item.at, film: item.film }, 60000);
          if (S.me && item.code === S.code) S.me.shots = r.shots;
        } catch (e) {
          if (e.code === 'roll_finished' || e.code === 'bad_image' || e.code === 'image_too_big') { /* drop it */ }
          else { pumpTimer = setTimeout(pumpQueue, 15000); break; }
        }
        if (item.key !== undefined) await QDB.del(item.key);
        S.queue.shift();
        renderCamera();
      }
    } finally { pumping = false; renderCamera(); }
  }
  async function addShot(dataURL, when) {
    const item = { code: S.code, data: dataURL, at: when.toISOString(), film: S.cam.film };
    const key = await QDB.add(item);
    if (key !== null && key !== undefined) item.key = key;
    S.queue.push(item);
    S.cam.fresh = (S.me.shotsMax || 15) - shotsLeft() - 1;
    if (shotsLeft() <= 0) stopLive();
    renderCamera();
    toast(t('camTaken', { n: (S.me.shotsMax || 15) - shotsLeft(), m: S.me.shotsMax || 15 }));
    pumpQueue();
  }

  function renderCamera() {
    if (S.screen !== 'camera' || !S.me) return;
    const max = S.me.shotsMax || 15, left = shotsLeft(), used = max - left;

    if (e.target.id !== 'a-find') return;
    S.findQ = e.target.value;
    clearTimeout(findTimer);
    findTimer = setTimeout(async () => {
      if (!S.findQ.trim()) { S.found = []; renderAdmin(); return; }
      try { S.found = (await api('admin', { pw: S.pw, op: 'find', q: S.findQ })).people; renderAdmin(); } catch (x) { toast(errText(x)); }
    }, 350);
  });
  $('#admin-body').addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    const rr = () => renderAdmin();
    if (b.id === 'a-open') { if (arm('open', rr)) await adminOp('setSetting', { key: 'voting', value: 'open' }); return; }
    if (b.id === 'a-close') { if (arm('close', rr)) await adminOp('setSetting', { key: 'voting', value: 'done' }); return; }
    if (b.id === 'a-reopen') { if (arm('reopen', rr)) await adminOp('setSetting', { key: 'voting', value: 'open' }); return; }
    if (b.id === 'a-toggle') { S.showResults = !S.showResults; renderAdmin(); return; }
    if (b.id === 'a-reveal') { openStage(); return; }
    if (b.id === 'a-heads') { await adminOp('setSetting', { key: 'headshots', value: S.adm.settings.headshots === 'open' ? 'closed' : 'open' }); return; }
    if (b.id === 'a-develop') { if (arm('develop', rr)) await adminOp('setSetting', { key: 'developed', value: 'yes' }); return; }
    if (b.id === 'a-album') { S.album = null; go('album'); return; }
    if (b.id === 'a-reset') {
      if ($('#a-reset-word').value.trim() !== 'RESET') { $('#a-reset-word').focus(); return; }
      const r = await adminOp('resetTestData', { confirm: 'RESET' });
      if (r) toast(t('resetDone'));
      return;
    }
    if (b.id === 'a-school-set') {
      const url = $('#a-school-url').value.trim();
      if (!url) { $('#a-school-url').focus(); return; }
      const r = await adminOp('setSchoolFolder', { url });
      if (r) stageSchool();
      return;
    }
    if (b.id === 'a-school-stage') { stageSchool(); return; }
    if (b.id === 'a-key') { const r = await adminOp('importKey'); if (r) { S.school.key = r.key; renderAdmin(); } return; }
    if (b.id === 'a-key-copy') { try { await navigator.clipboard.writeText(S.school.key); toast(t('copied')); } catch (e) {} return; }
    if (b.id === 'a-school-load') { loadSchool(); return; }
    if (b.dataset.cls) { S.school.cls = b.dataset.cls; renderAdmin(); return; }
    if (b.closest('[data-sp]')) { openPair(b.closest('[data-sp]').dataset.sp); return; }
    if (b.dataset.qr) { showQR(S.found.find(p => p.id === b.dataset.qr)); return; }
    if (b.dataset.reissue) {
      const id = b.dataset.reissue;
      if (!arm('re' + id, rr)) return;
      const r = await adminOp('reissue', { id });
      if (r) { const p = S.found.find(x => x.id === id); if (p) { p.code = r.code; renderAdmin(); showQR(p); } }
      return;
    }
    if (b.dataset.delhead) {
      const id = b.dataset.delhead;
      if (!arm('dh' + id, rr)) return;
      const r = await adminOp('deleteHeadshot', { id });
      if (r) { const p = S.found.find(x => x.id === id); if (p) p.photo = ''; renderAdmin(); }
    }
  });
  function loginUrl(code) { return CFG.site.replace(/[?#].*$/, '') + '?c=' + code; }
  function showQR(p) {
    if (!p) return;
    let svg = '';
    try {
      if (window.qrcode) { const q = window.qrcode(0, 'M'); q.addData(loginUrl(p.code)); q.make(); svg = q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); }
    } catch (e) { svg = ''; }
    openSheet(`<h2 class="sheet-title" id="sheet-title">${esc(p.name)}</h2><div class="qr-box">${svg}<span class="qr-code">${esc(fmtCode(p.code))}</span><span class="find-meta" style="color:inherit">${esc(p.class)}</span></div>`
      + `<div class="sheet-actions" style="grid-template-columns:1fr"><button type="button" class="btn btn-ghost" id="qr-close">${esc(t('close'))}</button></div>`);
  }

  /* ---------- sound ---------- */
  const Sound = (() => {
    let ctx = null, noise = null, nodes = [];
    function audio() {
      if (!S.sound) return null;
      try {
        if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
        if (ctx.state === 'suspended') ctx.resume();
        if (!noise) { noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
        return ctx;
      } catch (err) { return null; }
    }
    function track(n) { nodes.push(n); n.onended = () => { nodes = nodes.filter(x => x !== n); }; }
    function hit(c, at, level) {
      const src = c.createBufferSource(); src.buffer = noise;
      const band = c.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = 1500 + Math.random() * 600; band.Q.value = 0.8;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(level, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.09);
      src.connect(band); band.connect(g); g.connect(c.destination);
      src.start(at, Math.random()); src.stop(at + 0.12);
      track(src);
    }
    function roll(seconds) { const c = audio(); if (!c) return; const t0 = c.currentTime + 0.02; for (let x = 0; x < seconds;) { const p = x / seconds; hit(c, t0 + x, 0.04 + 0.2 * p * p); x += 1 / (14 + 16 * p); } }
    function tone(c, f, at, dur, level) {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = c.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(level, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(g); g.connect(c.destination); o.start(at); o.stop(at + dur + 0.05); track(o);
    }
    function chime() {
      const c = audio(); if (!c) return;
      const t0 = c.currentTime + 0.01;
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(110, t0); o.frequency.exponentialRampToValueAtTime(46, t0 + 0.35);
      const og = c.createGain(); og.gain.setValueAtTime(0.4, t0); og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
      o.connect(og); og.connect(c.destination); o.start(t0); o.stop(t0 + 0.65); track(o);
      [1046.5, 1318.5, 1568, 2093].forEach((f, i) => { tone(c, f, t0 + 0.05 + i * 0.09, 1.6, 0.1); tone(c, f * 2.76, t0 + 0.05 + i * 0.09, 0.6, 0.02); });
    }
    function click() { const c = audio(); if (!c) return; const t0 = c.currentTime + 0.005; hit(c, t0, 0.35); hit(c, t0 + 0.07, 0.18); }
    function stop() { nodes.forEach(n => { try { n.stop(); } catch (err) { /* stopped */ } }); nodes = []; }
    return { roll, chime, click, stop };
  })();

  /* ---------- sparks ---------- */
  const Sparks = (() => {
    const cv = $('#sparks');
    let ctx = null, parts = [], raf = 0, dpr = 1;
    function burst() {
      if (REDUCED()) return;
      if (!ctx) ctx = cv.getContext('2d');
      if (!ctx) return;
      dpr = Math.min(2, window.devicePixelRatio || 1);
      const W = window.innerWidth, H = window.innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      const cs = getComputedStyle(document.documentElement);
      const cols = ['--gold-hi', '--flame', '--flame-core', '--gold', '--wax-hi'].map(v => cs.getPropertyValue(v).trim()).filter(Boolean);
      const count = Math.round(Math.min(260, 110 + W / 7));
      for (let i = 0; i < count; i++) {
        const left = i % 2 === 0, spread = 0.2 + Math.random() * 0.55, ang = -Math.PI / 2 + (left ? spread : -spread), speed = (H / 800) * 17 * (0.7 + Math.random() * 0.55);
        parts.push({ x: left ? -6 : W + 6, y: H * (0.72 + Math.random() * 0.1), vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, life: 0, max: 170 + Math.random() * 140, r: 1 + Math.random() * 2.4, c: cols[i % cols.length] || '#EBCB7E', star: Math.random() < 0.35, ph: Math.random() * 6 });
      }
      if (!raf) raf = requestAnimationFrame(frame);
    }
    function frame() {
      raf = 0;
      const W = window.innerWidth, H = window.innerHeight, g = 0.2 * H / 800, maxFall = 1.6 * H / 800;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H); ctx.globalCompositeOperation = 'lighter';
      parts = parts.filter(p => p.life < p.max && p.y < H + 30);
      for (const p of parts) {
        p.vx *= 0.986; p.vy = Math.min(p.vy * 0.986 + g, maxFall); p.x += p.vx; p.y += p.vy; p.life += 1;
        ctx.globalAlpha = Math.max(0, (1 - p.life / p.max) * (0.65 + 0.35 * Math.sin(p.life * 0.3 + p.ph)));
        ctx.fillStyle = p.c;
        if (p.star) {
          const s = p.r * 3; ctx.beginPath();
          ctx.moveTo(p.x, p.y - s); ctx.lineTo(p.x + s * 0.22, p.y - s * 0.22); ctx.lineTo(p.x + s, p.y); ctx.lineTo(p.x + s * 0.22, p.y + s * 0.22);
          ctx.lineTo(p.x, p.y + s); ctx.lineTo(p.x - s * 0.22, p.y + s * 0.22); ctx.lineTo(p.x - s, p.y); ctx.lineTo(p.x - s * 0.22, p.y - s * 0.22); ctx.closePath(); ctx.fill();
        } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
      }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      if (parts.length) raf = requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    }
    function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; parts = []; if (ctx) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); } }
    return { burst, stop };
  })();

  /* ---------- reveal ---------- */
  const stage = $('#stage');
  const R = { i: 0, phase: 'sealed', timers: [] };
  let wakeLock = null;
  function winnersOf(cat) {
    const tally = (S.adm && S.adm.results[cat]) || {};
    const list = ((S.adm && S.adm.roster) || S.roster).filter(p => p.list === cat).map(p => ({ p, n: tally[p.id] || 0 })).sort((a, b) => b.n - a.n);
    const top = list.length ? list[0].n : 0;
    return top > 0 ? list.filter(x => x.n === top).map(x => x.p) : [];
  }
  function winnerCard(p, cat) {
    return `<figure class="w-card"><span class="w-crown">${CROWN}</span><span class="w-frame"><span class="w-photo">${p.photo ? `<img src="${esc(p.photo.replace(/sz=w\d+/, 'sz=w900'))}" alt="" referrerpolicy="no-referrer">` : `<span class="initials">${esc(initials(p))}</span>`}<span class="w-sash">${CAT_LABEL[cat]}</span></span></span>`
      + `<figcaption class="w-name">${esc(p.name)}</figcaption><span class="w-meta">${esc([p.en, p.class].filter(Boolean).join(' · '))}</span></figure>`;
  }
  function renderStageTools() { const snd = $('#stage-sound'); snd.textContent = t(S.sound ? 'soundOn' : 'soundOff'); snd.setAttribute('aria-pressed', String(S.sound)); }
  function renderStage() {
    renderStageTools();
    const main = $('#stage-main'), foot = $('#stage-foot');
    main.classList.remove('is-opening');
    if (R.phase === 'final') {
      main.innerHTML = `<p class="stage-lead">${esc(t('finalLead'))}</p><h2 class="stage-title">${esc(t('finalTitle'))}</h2><div class="winners duo">${CATS.map(cat => winnersOf(cat).map(p => winnerCard(p, cat)).join('')).join('')}</div>`;
      foot.innerHTML = `<button type="button" class="btn btn-gold" id="stage-done">${esc(t('exitReveal'))}</button>`;
      return;
    }
    const cat = CATS[R.i];
    if (R.phase === 'sealed' || R.phase === 'opening') {
      main.innerHTML = `<p class="stage-lead">${esc(t('sealedLead'))}</p><h2 class="stage-cat">${CAT_LABEL[cat]}</h2>`
        + `<button type="button" class="env" id="env" aria-label="${esc(t('openEnv', { cat: CAT_LABEL[cat] }))}"><span class="env-back"></span><span class="env-letter"><span class="env-letter-s">Prom Night</span><span class="env-letter-k">${CAT_LABEL[cat]}</span></span><span class="env-pocket"></span><span class="env-flap"></span><span class="env-seal">${CROWN}</span></button>`;
      foot.innerHTML = `<p class="stage-caption">${esc(t('tapSeal', { cat: CAT_LABEL[cat] }))}</p>`;
      return;
    }
    const ws = winnersOf(cat);
    main.innerHTML = ws.length
      ? `<p class="stage-lead">${esc(t(ws.length > 1 ? 'tieLead' : 'winnerLead', { cat: CAT_LABEL[cat] }))}</p><div class="winners${ws.length > 1 ? ' duo' : ''}">${ws.map(p => winnerCard(p, cat)).join('')}</div>`
      : `<p class="stage-title">${esc(t('noVotes'))}</p>`;
    foot.innerHTML = R.i === 0 ? `<button type="button" class="btn btn-gold" id="stage-next">${esc(t('nextQueen'))}${ARROW}</button>` : `<button type="button" class="btn btn-gold" id="stage-final">${esc(t('finale'))}</button>`;
  }
  function focusStageAction() { const b = $('#stage-next') || $('#stage-final') || $('#stage-done'); if (b) b.focus({ preventScroll: true }); }
  function openEnvelope() {
    if (R.phase !== 'sealed') return;
    const env = $('#env');
    if (REDUCED() || !env) { R.phase = 'shown'; renderStage(); focusStageAction(); return; }
    R.phase = 'opening';
    $('#stage-main').classList.add('is-opening');
    env.classList.add('open');
    Sound.roll(1.8);
    R.timers.push(setTimeout(() => env.classList.add('gone'), 1650));
    R.timers.push(setTimeout(() => { R.phase = 'shown'; renderStage(); Sound.chime(); Sparks.burst(); focusStageAction(); }, 2000));
  }
  async function openStage() {
    await loadAdmin();
    R.i = 0; R.phase = 'sealed'; R.timers.forEach(clearTimeout); R.timers = [];
    stage.hidden = false;
    document.documentElement.classList.add('stage-open');
    renderStage();
    const env = $('#env'); if (env) env.focus({ preventScroll: true });
    try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) { wakeLock = null; }
  }
  function closeStage() {
    R.timers.forEach(clearTimeout); R.timers = [];
    Sparks.stop(); Sound.stop();
    stage.hidden = true;
    document.documentElement.classList.remove('stage-open');
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    try { if (wakeLock) wakeLock.release(); } catch (err) { /* ignore */ }
    wakeLock = null;
  }
  stage.addEventListener('click', e => {
    if (e.target.closest('#env')) { openEnvelope(); return; }
    if (e.target.closest('#stage-next')) { R.i = 1; R.phase = 'sealed'; Sparks.stop(); renderStage(); const env = $('#env'); if (env) env.focus({ preventScroll: true }); return; }
    if (e.target.closest('#stage-final')) { R.phase = 'final'; renderStage(); Sound.chime(); Sparks.burst(); focusStageAction(); return; }
    if (e.target.closest('#stage-done') || e.target.closest('#stage-exit')) { closeStage(); return; }
    if (e.target.closest('#stage-sound')) { S.sound = !S.sound; if (!S.sound) Sound.stop(); renderStageTools(); return; }
    if (e.target.closest('#stage-fs')) {
      const root = document.documentElement;
      if (document.fullscreenElement) { if (document.exitFullscreen) document.exitFullscreen().catch(() => {}); }
      else if (root.requestFullscreen) root.requestFullscreen().catch(() => {});
    }
  });

  document.addEventListener('keydown', e => {
    if (!$('#lightbox').hidden) { if (e.key === 'ArrowLeft') lbStep(-1); else if (e.key === 'ArrowRight') lbStep(1); }
    if (e.key !== 'Escape') return;
    if (!$('#picker').hidden) closePicker();
    else if (!$('#sheet').hidden) closeSheet();
    else if (!$('#lightbox').hidden) closeLightbox();
    else if (!stage.hidden) closeStage();
  });

  /* ---------- language ---------- */
  $$('.lang button').forEach(b => b.addEventListener('click', () => {
    S.lang = b.dataset.lang;
    store.set('prom-lang', S.lang);
    render();
    if (!$('#picker').hidden) renderPicker();
    if (!stage.hidden) renderStage();
    if (!$('#lightbox').hidden) renderLightbox();
  }));

  /* ---------- start ---------- */
  const savedLang = store.get('prom-lang');
  S.lang = savedLang === 'en' || savedLang === 'zh' ? savedLang : 'zh';
  const savedFilm = store.get('prom-film');
  if (FILM_IDS.includes(savedFilm)) S.cam.film = savedFilm;
  try { S.pw = sessionStorage.getItem('prom-pw') || ''; } catch (e) { S.pw = ''; }
  $('#stage-fs').hidden = !document.fullscreenEnabled;
  drawStars();
  let resizeTimer = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawStars, 150); });

  const params = new URLSearchParams(location.search);
  const fromLink = clean(params.get('c') || '');
  if (params.has('c') || params.has('album')) history.replaceState(null, '', location.pathname);
  const startCode = fromLink.length === 8 ? fromLink : clean(store.get('prom-code') || '');
  go(params.has('album') ? 'album' : 'welcome', { focus: false });
  if (startCode.length === 8) signIn(startCode, !!fromLink);
})();

</script>
</body>
